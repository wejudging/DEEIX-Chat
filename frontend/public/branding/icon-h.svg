<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">HOHAI transparent black rounded H</title>
  <desc id="desc">A centered, symmetrical, softly rounded black H with transparent diagonal cutouts and no background.</desc>

  <defs>
    <clipPath id="balanced-rounded-h-clip">
      <path d="
        M138 116
        H183
        Q205 116 205 138
        V206
        Q205 220 219 220
        H293
        Q307 220 307 206
        V138
        Q307 116 329 116
        H374
        Q396 116 396 138
        V374
        Q396 396 374 396
        H329
        Q307 396 307 374
        V306
        Q307 292 293 292
        H219
        Q205 292 205 306
        V374
        Q205 396 183 396
        H138
        Q116 396 116 374
        V138
        Q116 116 138 116
        Z"/>
    </clipPath>

    <!-- Black removes the wide diagonal band; white restores five thin H stripes. -->
    <mask id="transparent-stripe-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#ffffff"/>
      <path d="M-80 592 592-80"
            fill="none"
            stroke="#000000"
            stroke-width="84"/>
      <g fill="none" stroke="#ffffff" stroke-width="7.5">
        <path d="M-80 537 537-80"/>
        <path d="M-80 565 565-80"/>
        <path d="M-80 593 593-80"/>
        <path d="M-80 621 621-80"/>
        <path d="M-80 649 649-80"/>
      </g>
    </mask>
  </defs>

  <g clip-path="url(#balanced-rounded-h-clip)"
     mask="url(#transparent-stripe-mask)"
     shape-rendering="geometricPrecision">
    <rect width="512" height="512" fill="#000000"/>
  </g>
</svg>
